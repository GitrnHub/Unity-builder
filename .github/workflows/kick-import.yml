name: Kick VoxelGame import

on:
  push:
    branches: [main]
    paths:
      - .github/import-trigger

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch import workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run import-voxel.yml --repo "${{ github.repository }}" --ref main
